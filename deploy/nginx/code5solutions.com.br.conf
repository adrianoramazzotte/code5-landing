# code5solutions.com.br — landing page institucional da Code5 Solutions.
#
# Site ESTÁTICO servido direto pelo nginx nativo (o proxy central da VPS
# compartilhada). Não usa proxy_pass, não sobe container e não ocupa porta
# nenhuma da faixa 31xx/32xx/33xx do contrato PORTAS-VPS.md.
#
# Certificado: Let's Encrypt via certbot (webroot), apex + www. Não é
# wildcard — este domínio não tem subdomínio por cliente.

server {
    listen 80;
    listen [::]:80;
    server_name code5solutions.com.br www.code5solutions.com.br;

    # Renovação do certificado continua passando por HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/code5solutions.com.br;
    }

    location / {
        return 301 https://code5solutions.com.br$request_uri;
    }
}

# www → apex, para o site ter um endereço canônico só.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.code5solutions.com.br;

    ssl_certificate     /etc/letsencrypt/live/code5solutions.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/code5solutions.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://code5solutions.com.br$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name code5solutions.com.br;

    ssl_certificate     /etc/letsencrypt/live/code5solutions.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/code5solutions.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/code5solutions.com.br;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # O HTML muda a cada deploy: nunca cachear. Os assets têm nome fixo
    # (styles.css, main.js), então cache curto — imagem pode ser longo.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location ~* \.(css|js)$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }
    location ~* \.(jpe?g|png|webp|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

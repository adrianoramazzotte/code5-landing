# code5solutions.com.br — bloco TEMPORÁRIO (só HTTP), usado para emitir o
# certificado com o desafio webroot. Depois é substituído pelo .conf final.
#
# Contrato da VPS (DEFINICOES-DOCS/PORTAS-VPS.md): só o nginx nativo escuta
# 80/443. Este site é ESTÁTICO — não consome porta nenhuma da faixa 3xxx.

server {
    listen 80;
    listen [::]:80;
    server_name code5solutions.com.br www.code5solutions.com.br;

    root /var/www/code5solutions.com.br;
    index index.html;

    location /.well-known/acme-challenge/ {
        root /var/www/code5solutions.com.br;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

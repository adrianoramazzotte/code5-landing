name: Publicar em produção

# Só a main publica. A dev passa pelo Validar e para por aí.
#
# COMO A PUBLICAÇÃO ACONTECE: quem envia os arquivos é a própria VPS, não o
# runner do GitHub. Um timer systemd (deploy-code5-poll.timer) verifica a cada
# 3 minutos se a main tem commit novo e, se tiver, atualiza o site. É o mesmo
# padrão já usado pelo appmercado e pelo appsalaodebeleza nesta VPS, porque o
# firewall de borda da Hostinger não deixa o runner do GitHub chegar na porta
# 22. Este workflow, portanto, valida e depois ESPERA o commit aparecer no ar
# — se não aparecer, ele falha e você fica sabendo.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: producao
  cancel-in-progress: false

jobs:
  validar:
    uses: ./.github/workflows/validar.yml

  confirmar:
    name: Confirmar publicação
    needs: validar
    runs-on: ubuntu-latest
    environment:
      name: producao
      url: https://code5solutions.com.br
    steps:
      - name: Esperar a VPS publicar este commit
        run: |
          esperado="${GITHUB_SHA}"
          echo "Aguardando https://code5solutions.com.br/version.txt virar $esperado"
          for tentativa in $(seq 1 40); do   # 40 x 15s = 10 minutos
            atual=$(curl -fsS --max-time 10 https://code5solutions.com.br/version.txt 2>/dev/null | tr -d '[:space:]' || echo "")
            if [ "$atual" = "$esperado" ]; then
              echo "Publicado na tentativa $tentativa."
              exit 0
            fi
            echo "  [$tentativa/40] no ar: ${atual:-<sem version.txt>}"
            sleep 15
          done
          echo "::error::O commit não chegou ao ar em 10 minutos. Verifique na VPS: systemctl status deploy-code5-poll.service"
          exit 1

      - name: Teste de fumaça
        run: |
          codigo=$(curl -s -o /tmp/pagina.html -w '%{http_code}' https://code5solutions.com.br/)
          echo "página: HTTP $codigo"; test "$codigo" = "200"
          grep -q "Code5 Solutions" /tmp/pagina.html
          for asset in assets/css/styles.css assets/js/main.js assets/portfolio/meumercadoon.jpeg; do
            c=$(curl -s -o /dev/null -w '%{http_code}' "https://code5solutions.com.br/$asset")
            echo "$asset -> $c"; test "$c" = "200"
          done
          echo "No ar: https://code5solutions.com.br"
